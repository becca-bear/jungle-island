<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jungle Island — gallery</title>
<style>
  :root { --bg: #0b1622; --panel: #142230; --line: rgba(255, 255, 255, 0.13); --acc: #ffdd33; --dim: #9fb0bc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #e8eef2; font: 14px/1.45 system-ui, 'Segoe UI', sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(11, 22, 34, 0.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 14px 22px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.06em; }
  h1 a { color: var(--acc); text-decoration: none; }
  .planet-link { color: var(--acc); }
  #q { flex: 1; min-width: 220px; max-width: 460px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #16222e; color: inherit; font: inherit; }
  #count { color: var(--dim); }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .chip { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: #cfd9e0; cursor: pointer; font: inherit; font-size: 13px; }
  .chip.on { background: var(--acc); color: #1a1a10; border-color: var(--acc); font-weight: 600; }
  main { padding: 20px 22px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--acc); }
  .card canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: #1b2c3b; }
  .card .body { padding: 9px 12px 11px; }
  .card b { font-size: 15px; }
  .card .grp { color: var(--acc); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; }
  .card .where { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 5px 9px; margin: 10px 0 0; font-size: 12px; }
  .facts dt { color: var(--dim); }
  .facts dd { margin: 0; min-width: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .swatches span { width: 17px; height: 13px; border: 1px solid #9fb0bc80; border-radius: 3px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .tags span { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #203346; color: #c8d6e0; }
  #modal { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; padding: 12px; border: 0; background: transparent; color: inherit; }
  #modal[open] { display: grid; place-items: center; }
  #modal::backdrop { background: rgba(4, 8, 12, 0.86); }
  #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(760px, 100%); max-height: 100%; overflow: auto; }
  #big, #big-terran { width: 100%; aspect-ratio: 16 / 9; max-height: 48vh; display: block; border-radius: 8px; background: #1b2c3b; cursor: grab; touch-action: none; }
  .modal-head, .preview-controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .modal-head { justify-content: space-between; margin-bottom: 10px; }
  .preview-controls { margin-top: 10px; }
  .preview-controls label { display: flex; gap: 6px; align-items: center; }
  .preview-controls select, .preview-controls button, #m-close { color: inherit; background: #203346; border: 1px solid var(--line); padding: 5px 8px; border-radius: 6px; font: inherit; }
  .preview-controls button:disabled { opacity: 0.55; }
  #modal h2 { margin: 0; }
  #m-note:empty { display: none; }
  #modal p { margin: 2px 0; color: var(--dim); }
  #empty { grid-column: 1 / -1; color: var(--dim); padding: 40px 0; text-align: center; display: none; }
</style>
</head>
<body>
<header>
  <h1><a href="./index.html">JUNGLE ISLAND</a> · gallery</h1>
  <input id="q" type="search" placeholder="Search by name, habitat or variant…" aria-label="Search gallery" autofocus />
  <span id="count"></span>
  <a class="planet-link" href="./index.html">Return to Jungle Island ↗</a>
  <div id="chips"></div>
</header>
<main id="grid"><div id="empty">Nothing matches that search.</div></main>
<dialog id="modal" aria-labelledby="m-name">
  <div class="box">
    <div class="modal-head"><h2 id="m-name"></h2><button id="m-close" type="button" autofocus>Close</button></div>
    <canvas id="big" role="img" aria-label="3D model preview"></canvas>
    <canvas id="big-terran" role="img" aria-label="3D model preview" hidden></canvas>
    <div class="preview-controls">
      <label>Variant <select id="m-variant"></select></label>
      <label>Motion <select id="m-motion"></select></label>
      <button id="m-play" type="button">Pause motion</button>
      <button id="m-rotate" type="button">Rotate model</button>
    </div>
    <dl class="facts">
      <dt>Model size</dt><dd id="m-size"></dd><dt>Colors</dt><dd class="swatches" id="m-colors"></dd>
      <dt id="m-spawn-label" hidden>Spawns</dt><dd id="m-spawns" hidden></dd>
    </dl>
    <p id="m-note"></p><p id="m-where"></p><div class="tags" id="m-tags"></div>
  </div>
</dialog>
<iframe id="asset-source" src="index.html?galleryData" title="Asset model source" hidden></iframe>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="terran-gallery/bundle.js"></script>
<script src="gallery-motion.js"></script>
<script src="gallery.js"></script>
</body>
</html>
